<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI協働設定ツール v0.5.1</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">AI協働設定ツール</div>
    <div class="version">v0.5.1</div>
  </header>

  <section id="introView" class="panel">
    <h1>AIとの働き方を設定する</h1>
    <p class="lead">
      質問に答えるだけで、あなたに合ったAIとの協働ルールを生成する。
    </p>
    <ul class="intro-points">
      <li>全13問。回答から固定ルールを決定論的に選択する。</li>
    </ul>
    <div class="nav">
      <div class="nav-right">
        <button class="btn primary" id="startBtn" type="button">はじめる</button>
      </div>
    </div>
  </section>

  <section id="questionView" class="panel hidden" aria-live="polite">
    <div class="meta-row">
      <span id="questionProgress" class="question-number"></span>
    </div>

    <div id="questionContainer"></div>

    <div id="validationMessage" class="validation hidden" role="alert"></div>

    <div class="nav">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <div class="nav-right">
        <button class="btn primary" id="nextBtn" type="button">次へ</button>
      </div>
    </div>
  </section>

  <section id="resultView" class="panel hidden">
    <h1>生成結果</h1>
    <p class="lead">選択した協働条件だけを、AIとの行動ルールとして出力する。</p>

    <div id="emptyResult" class="hidden">
      <p>現在の回答では、AIの既定動作から明示的に変更する協働ルールはない。</p>
    </div>

    <div id="resultContent" class="hidden">
      <div class="result-actions">
        <button class="btn primary" id="copyBtn" type="button">コピー</button>
        <button class="btn" id="downloadBtn" type="button">.md として保存</button>
      </div>
      <div class="code-wrap">
        <pre id="markdownOutput"></pre>
      </div>
      <div id="copyStatus" class="status" aria-live="polite"></div>
    </div>

    <details>
      <summary>回答を確認する</summary>
      <ul id="reviewList" class="review-list"></ul>
    </details>

    <div class="nav">
      <button class="btn" id="editAnswersBtn" type="button">回答を見直す</button>
      <div class="nav-right">
        <button class="btn" id="restartBtn" type="button">最初からやり直す</button>
      </div>
    </div>
  </section>
</main>

<script src="./app.js" defer></script>
</body>
</html>
